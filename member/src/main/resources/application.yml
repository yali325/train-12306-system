# application.yml
server:
  port: 8101
  servlet:
    context-path: /member

spring:
  application:
    name: member
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/train?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 741963
  cloud:
    nacos:
      # 配置中心
      config:
        server-addr: 127.0.0.1:8848
        namespace: 1a7dda0c-1ac0-4f74-979a-6bc32f2bfcc3
        file-extension: yml
        group: DEFAULT_GROUP
        refresh-enabled: true  # 配置变更自动刷新
      # 注册与发现中心
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 1a7dda0c-1ac0-4f74-979a-6bc32f2bfcc3
        service: member
        heartbeat-interval: 5
        weight: 1
seata:
  # seata配置中心，从nacos获取配置
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: 1a7dda0c-1ac0-4f74-979a-6bc32f2bfcc3
      group: SEATA_GROUP
      context-path:
      username: nacos
      password: nacos
      data-id: seataServer.yml
  # seata 注册中心，注册到nacos
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: 1a7dda0c-1ac0-4f74-979a-6bc32f2bfcc3
      cluster: default
      context-path:
      username: nacos
      password: nacos
  # seata 事务组名称
  tx-service-group: train-group
  # 事务组和集群的关联——放在nacos配置里面了
  service:
    vgroup-mapping:
      train-group: default

#mybatis
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml

logging:
  level:
    com.yali.member.mapper: TRACE
